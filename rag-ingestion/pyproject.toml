[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-rag-ingestion"
version = "1.0.0"
description = "Ingestion pipeline that chunks, embeds and indexes HR policy documents into Pinecone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pinecone>=10.0.0,<11",
    "langchain-text-splitters>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hr-ingest = "hr_rag_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
